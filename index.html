<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso | DevPlatform</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login">

    <main class="mayo">
        <section class="junio">

            <header>
                <h1 class="titulo">Dev<span class="h">Platform</span></h1>
                <p class="texto">Ingresa tus credenciales para acceder al panel de control</p>
            </header>

            <form class="form" action="dashboard.html" method="get">

                <label class="te" for="correo"><strong>Correo Electrónico*</strong></label>
                <input type="email" id="correo" name="correo" class="barra" placeholder="ejemplo@sena.edu.co" required>

                <label class="te" for="clave"><strong>Contraseña*</strong></label>
                <input type="password" id="clave" name="clave" class="barra" placeholder="••••••••" minlength="6" required>

                <label class="te" for="nivel"><strong>Rol de Desarrollo*</strong></label>
                <select id="nivel" name="rol" class="barra" required>
                    <option class="p" value="">Selecciona una opción</option>
                    <option class="p" value="frontend">Desarrollador Frontend</option>
                    <option class="p" value="backend">Desarrollador Backend</option>
                    <option class="p" value="fullstack">Desarrollador FullStack</option>
                </select>

                <div class="divider"></div>

                <div class="check">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos de servicio y políticas de privacidad</label>
                </div>

                <button type="submit" class="btn">Ingresar al Dashboard</button>
            </form>

        </section>
    </main>

</body>
</html>
